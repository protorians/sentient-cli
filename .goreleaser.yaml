version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: .
    binary: sentient
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: packages
    format: tar.gz
    name_template: >-
      sentient-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip
  - id: binaries
    format: binary
    name_template: >-
      sentient_{{ .Version }}_{{ .Os }}_{{ .Arch }}

release:
  name_template: "{{ .ProjectName }} v{{ .Version }}"
  header: |
    ## Download binaries

    | Platform | Architecture | Archive | Binary |
    |----------|--------------|---------|--------|
    | Linux | amd64 | `sentient-cli_{{ .Version }}_linux_amd64.tar.gz` | `sentient_{{ .Version }}_linux_amd64` |
    | Linux | arm64 | `sentient-cli_{{ .Version }}_linux_arm64.tar.gz` | `sentient_{{ .Version }}_linux_arm64` |
    | macOS | amd64 (Intel) | `sentient-cli_{{ .Version }}_darwin_amd64.tar.gz` | `sentient_{{ .Version }}_darwin_amd64` |
    | macOS | arm64 (Apple Silicon) | `sentient-cli_{{ .Version }}_darwin_arm64.tar.gz` | `sentient_{{ .Version }}_darwin_arm64` |
    | Windows | amd64 | `sentient-cli_{{ .Version }}_windows_amd64.zip` | `sentient_{{ .Version }}_windows_amd64.exe` |

    Checksums for all binaries and archives are in `checksums.txt`.

    ## Install

    ### Go

    ```bash
    go install github.com/protorians/sentient-cli@{{ .Tag }}
    ```

    ### npm / pnpm / yarn / bun

    ```bash
    npm install -g @sentients/cli
    ```

checksum:
  name_template: checksums.txt

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"